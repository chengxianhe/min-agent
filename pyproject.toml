[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "min-agent"
version = "1.0.0"
description = "A minimal observable agent demo with a local Web workflow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = { file = "LICENSE" }
authors = [
  { name = "Jinwei" },
]
keywords = ["agent", "agentic-loop", "llm", "observability", "demo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/JinweiX/min-agent"
Repository = "https://github.com/JinweiX/min-agent"
Issues = "https://github.com/JinweiX/min-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]
